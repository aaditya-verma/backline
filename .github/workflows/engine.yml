name: Engine checks
# Unit tests, Groove MIDI calibration (must match DrumPath: BPM 100%, meter 100%, beat/fill 93%, identical
# drum output), and a smoke run over the Lakh clean_midi files. Only numbers are reported; no MIDI is kept.
on:
  push:
    branches: [main]
    paths: [engine/**, test/**, tools/calibrate-groove.mjs, tools/lakh-smoke.mjs, tools/build-engine.mjs, .github/workflows/engine.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm test
      - name: Plain-script build is up to date
        run: node tools/build-engine.mjs && git diff --exit-code engine/dist

  groove-calibration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Download Groove MIDI Dataset (Magenta, CC BY 4.0)
        run: |
          mkdir -p "$RUNNER_TEMP/gmd-dl" "$RUNNER_TEMP/gmd"
          curl -fsSL -o "$RUNNER_TEMP/gmd-dl/g.zip" https://storage.googleapis.com/magentadata/datasets/groove/groove-v1.0.0-midionly.zip
          echo "651cbc524ffb891be1a3e46d89dc82a1cecb09a57c748c7b45b844c4841dcc1e  $RUNNER_TEMP/gmd-dl/g.zip" | sha256sum -c
          unzip -q "$RUNNER_TEMP/gmd-dl/g.zip" -d "$RUNNER_TEMP/gmd"
      - name: Calibrate
        run: |
          set +e
          node tools/calibrate-groove.mjs "$RUNNER_TEMP/gmd/groove" "$RUNNER_TEMP/calibration.json"; rc=$?
          { echo "### Groove MIDI calibration"; echo '```json'; cat "$RUNNER_TEMP/calibration.json"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $rc
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: groove-calibration, path: "${{ runner.temp }}/calibration.json" }

  lakh-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Download clean_midi from the Lakh mirror and unpack outside the checkout
        run: |
          mkdir -p "$RUNNER_TEMP/lakh-dl" "$RUNNER_TEMP/lakh-scratch"
          curl -fL --retry 3 -o "$RUNNER_TEMP/lakh-dl/clean_midi.tar.gz" http://hog.ee.columbia.edu/craffel/lmd/clean_midi.tar.gz
          tar -xzf "$RUNNER_TEMP/lakh-dl/clean_midi.tar.gz" -C "$RUNNER_TEMP/lakh-scratch" --no-same-owner --no-same-permissions
      - name: Engine over every file
        run: |
          node tools/lakh-smoke.mjs "$RUNNER_TEMP/lakh-scratch" "$RUNNER_TEMP/lakh-smoke.json"
          { echo "### Lakh smoke run (engine over clean_midi)"; echo '```json'; cat "$RUNNER_TEMP/lakh-smoke.json"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with: { name: lakh-smoke, path: "${{ runner.temp }}/lakh-smoke.json" }
