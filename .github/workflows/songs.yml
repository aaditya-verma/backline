name: Hand-check songs
# Runs the engine on the songs in tools/check-songs.txt and writes key, tempo, form and chords per section
# to the job summary. Derived data only; the MIDI files stay on the runner and are deleted with it.
on:
  push:
    branches: [main]
    paths: [tools/check-songs.txt, tools/lakh-songs.mjs, .github/workflows/songs.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  songs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Download clean_midi and unpack outside the checkout
        run: |
          mkdir -p "$RUNNER_TEMP/dl" "$RUNNER_TEMP/scratch"
          curl -fL --retry 3 -o "$RUNNER_TEMP/dl/c.tar.gz" http://hog.ee.columbia.edu/craffel/lmd/clean_midi.tar.gz
          tar -xzf "$RUNNER_TEMP/dl/c.tar.gz" -C "$RUNNER_TEMP/scratch" --no-same-owner --no-same-permissions
      - name: Engine on the hand-check songs
        run: |
          node tools/lakh-songs.mjs "$RUNNER_TEMP/scratch" tools/check-songs.txt "$RUNNER_TEMP/songs.md"
          cat "$RUNNER_TEMP/songs.md" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with: { name: hand-check, path: "${{ runner.temp }}/songs.md" }
